name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Run the demo end to end
        run: go run . | tee demo.txt
      - name: Every tampering attempt was caught
        run: test "$(grep -c 'INTEGRITY FAILURE' demo.txt)" -eq 4
